# ============================================================
# V-POKER Nginx 生产反向代理与静态资源配置
#
# 部署架构：
#   玩家浏览器 ──▶ Nginx (:80 / :443 HTTPS)
#                  ├─ /        → 前端 H5 静态资源 (/opt/vpoker/web)
#                  ├─ /api/*   → 反向代理 → 127.0.0.1:8080
#                  └─ /ws/*    → WebSocket 升级 → 127.0.0.1:8080
#
# 安装与启用：
#   sudo cp deploy/nginx-vpoker.conf /etc/nginx/sites-available/vpoker
#   sudo ln -sf /etc/nginx/sites-available/vpoker /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 配置 HTTPS（强烈建议）：
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-domain.com
# ============================================================

upstream vpoker_backend {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com; # 生产环境替换为您自己的域名或公网 IP

    # 前端静态文件根目录（部署约定）
    root /opt/vpoker/web;
    index index.html;

    # 上传与请求限制
    client_max_body_size 20M;

    # Gzip 压缩配置
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # ------------------------------------------------------------
    # 1. 前端 H5 静态资源托管
    # 前端为 hash 路由（manifest.json: h5.router.mode=hash）
    # ------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        # 入口 HTML 禁止强缓存，确保前端发版后玩家即时获取最新入口文件
        if ($request_filename ~* .*\.(?:htm|html)$) {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # 静态静态资源（带 hash 的 js/css/图片/字体）开启长期强缓存
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ------------------------------------------------------------
    # 2. 后端 REST API 反向代理
    # 后端 context-path: /api，所有 REST 接口前缀均为 /api
    # ------------------------------------------------------------
    location /api/ {
        proxy_pass http://vpoker_backend;
        proxy_http_version 1.1;

        # 传递真实客户端 IP 与协议
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 连接与读写超时
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
    }

    # ------------------------------------------------------------
    # 3. WebSocket 实时通信端点升级
    # 后端 JSR-356 @ServerEndpoint("/ws/room/{roomId}") 不带 /api 前缀
    # 客户端连接：ws://域名/ws/room/{roomId}
    # ------------------------------------------------------------
    location /ws/ {
        proxy_pass http://vpoker_backend;
        proxy_http_version 1.1;

        # WebSocket 协议升级标头（必须）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 客户端透传头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 牌局长连接：读写超时设置为 1 小时（3600秒），防止无数据时被 Nginx 提前切断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }

    # ------------------------------------------------------------
    # 4. 安全防护与隐藏文件拦截
    # ------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 日志输出
    access_log /var/log/nginx/vpoker_access.log;
    error_log  /var/log/nginx/vpoker_error.log warn;
}
